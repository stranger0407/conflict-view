databases:
  - name: conflictview-db
    plan: free
    databaseName: conflictview
    user: conflictview_user
    region: singapore

services:
  # Backend - Spring Boot
  - type: web
    name: conflictview-backend
    plan: free
    runtime: docker
    region: singapore
    dockerfilePath: ./conflict-view-backend/Dockerfile
    dockerContext: ./conflict-view-backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PGHOST
        fromDatabase:
          name: conflictview-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: conflictview-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: conflictview-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: conflictview-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: conflictview-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: "https://browser-sepia-five.vercel.app"
      - key: GDELT_ENABLED
        value: "true"
      - key: RSS_ENABLED
        value: "true"
      - key: NEWS_API_ENABLED
        value: "false"
